[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kl5core"
version = "0.1.0"
description = "Payphone manager building blocks: the Protel XNet protocol and download builder, a Protel manager, and Nortel Millennium download tables"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "White Clay Technologies LLC" }]
requires-python = ">=3.9"

[tool.setuptools]
packages = ["kl5core"]
